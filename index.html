<!DOCTYPE html>
<html lang="fr">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Démo Animations</title>

        <link rel="stylesheet" href="css/reset.css">
        <link rel="stylesheet" href="css/document.css">
        <link rel="stylesheet" href="css/styles.css">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">

    </head>

    <body>
        <h1>Animations</h1>
        <section>
            <h2>Univers</h2>
            <div>
                <button class="mpm-cta mpm-cta--univers" style="--mpm-cta-universe-anim: natureAnim; --mpm-cta-universe-anim-timing: 0.6s; --mpm-cta-universe-anim-loop: alternate-reverse"><img src="assets/univers-ic-nature.svg"/><span>Nature</span></button>

                <button class="mpm-cta mpm-cta--univers" style="--mpm-cta-universe-anim: histoireAnim; --mpm-cta-universe-anim-timing: 0.6s; --mpm-cta-universe-anim-loop: reverse"><img src="assets/univers-ic-histoire.svg"/><span>Histoire</span></button>

                <button class="mpm-cta mpm-cta--univers" style="--mpm-cta-universe-anim: decouvertesAnim; --mpm-cta-universe-anim-timing: 0.6s; --mpm-cta-universe-anim-loop: alternate-reverse"><img src="assets/univers-ic-decouvertes.svg"/><span>Découvertes</span></button>

                <button class="mpm-cta mpm-cta--univers" style="--mpm-cta-universe-anim: recitsAnim; --mpm-cta-universe-anim-timing: 0.25s; --mpm-cta-universe-anim-loop: alternate-reverse"><img src="assets/univers-ic-recits.svg"/><span>Récits</span></button>

                <button class="mpm-cta mpm-cta--univers" style="--mpm-cta-universe-anim: spaceAnim; --mpm-cta-universe-anim-timing: 0.3s; --mpm-cta-universe-anim-loop: alternate-reverse"><img src="assets/univers-ic-espace.svg"/><span>Espace</span></button>

                <button class="mpm-cta mpm-cta--univers" style="--mpm-cta-universe-anim: ensembleAnim; --mpm-cta-universe-anim-timing: 0.6s; --mpm-cta-universe-anim-loop: alternate-reverse"><img src="assets/univers-ic-ensemble.svg"/><span>Ensemble</span></button>

                <button class="mpm-cta mpm-cta--univers" style="--mpm-cta-universe-anim: creationsAnim; --mpm-cta-universe-anim-timing: 0.6s; --mpm-cta-universe-anim-loop: alternate-reverse"><img src="assets/univers-ic-creations.svg"/><span>Créations</span></button>

                <button class="mpm-cta mpm-cta--univers" style="--mpm-cta-universe-anim: experiencesAnim; --mpm-cta-universe-anim-timing: 1.2s; --mpm-cta-universe-anim-loop: alternate-reverse"><img src="assets/univers-ic-experiences.svg"/><span>Expériences</span></button>
            </div>
            <h2>CTA</h2>
            <div>
                <button class="mpm-cta" style="--mpm-cta-universe-anim: moreAnim; --mpm-cta-universe-anim-timing: .4s; --mpm-cta-universe-anim-loop: alternate-reverse">
                    <img src="assets/cta-right-arrow.svg"/>
                    <span>Découvrir</span>
                </button>
                <button class="mpm-cta mpm-cta--secondary" style="--mpm-cta-universe-anim: plusAnim; --mpm-cta-universe-anim-timing: .3s; --mpm-cta-universe-anim-loop: alternate-reverse">
                    <img src="assets/cta-more.svg"/>
                    <span>Plus de contenus</span>
                </button>
            </div>
            <h2>UI</h2>
                   <div>
                <button class="mpm-UI" style="--mpm-cta-universe-anim: watchAnim; --mpm-cta-universe-anim-timing: 0.6s; --mpm-cta-universe-anim-loop: alternate-reverse">
                    <img src="assets/ui-catalogue.svg"/>
                </button>
                <button class="mpm-UI" style="--mpm-cta-universe-anim: searchAnim; --mpm-cta-universe-anim-timing: 0.6s; --mpm-cta-universe-anim-loop: alternate-reverse">
                    <img src="assets/ui-search.svg"/>
                </button>

                <button class="mpm-UI" style="--mpm-cta-universe-anim: likeAnim; --mpm-cta-universe-anim-timing: 0.6s; --mpm-cta-universe-anim-loop: alternate-reverse">
                    <img src="assets/ui-love.svg"/>
                </button>
            </div>
            <h2>Tabs</h2>
            <div class="mpm-tabs-wrapper">
                <button class="mpm-tab" style="--mpm-tab-on-bg:#0A8518; --mpm-cta-universe-anim: watchAnim; --mpm-cta-universe-anim-timing: 0.6s; --mpm-cta-universe-anim-loop: alternate-reverse">
                    <img src="assets/tab-ic-regarder.svg"/>
                <span>Regarder</span>
                </button>
                <button class="mpm-tab" style="--mpm-tab-on-bg: #B7095B; --mpm-cta-universe-anim: readAnim; --mpm-cta-universe-anim-timing: 0.6s; --mpm-cta-universe-anim-loop: alternate-reverse">
                    <img src="assets/tab-ic-lire.svg"/>
                <span>Lire</span>
                </button>
                <button class="mpm-tab" style="--mpm-tab-on-bg: #0048F0; --mpm-cta-universe-anim: spaceAnim; --mpm-cta-universe-anim-timing: 0.3s; --mpm-cta-universe-anim-loop: alternate-reverse">
                    <img src="assets/tab-ic-jouer.svg"/>
                <span>Jouer</span>
                </button>
                <button class="mpm-tab mpm-tab-on" style="--mpm-tab-on-bg: #A600FF">
                    <img src="assets/tab-ic-ecouter.svg"/>
                <span>Ecouter</span>
                </button>
            </div>
        </section>
    </body>

</html>
